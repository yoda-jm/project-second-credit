<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>$GODOT_PROJECT_NAME: play in your browser</title>
<!-- Second Credit's web page (the export's custom HTML shell, see docs/web.md). URL options become the engine's user
     arguments: ?game=<id> opens that game, &demo lets its autopilot play. -->
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { background: #05060f; color: #e8eaf6; overflow: hidden; touch-action: none;
	font-family: "Kenney Future", "Segoe UI", system-ui, sans-serif; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
	gap: 1.2rem; background: radial-gradient(ellipse at 50% 40%, #1b1f45 0%, #05060f 70%); z-index: 2; }
#status h1 { margin: 0; font-size: clamp(2rem, 6vw, 4rem); letter-spacing: 0.12em; color: #ffd45a;
	text-shadow: 0 0 24px rgba(255, 200, 80, 0.45); }
#status p { margin: 0; opacity: 0.8; }
#bar { width: min(32rem, 80vw); height: 0.7rem; border-radius: 0.4rem; background: #1a1d36; overflow: hidden;
	box-shadow: inset 0 0 0 1px #3a4078; }
#bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #4cc9ff, #ffd45a); transition: width 0.2s; }
#play { display: none; font: inherit; font-size: 1.4rem; letter-spacing: 0.1em; padding: 0.9rem 2.4rem; border-radius: 0.6rem;
	border: 2px solid #ffd45a; background: rgba(255, 212, 90, 0.12); color: #ffd45a; cursor: pointer; }
#play:hover, #play:focus { background: rgba(255, 212, 90, 0.25); outline: none; }
#notice { display: none; max-width: 34rem; padding: 1rem 1.4rem; border-radius: 0.6rem; background: #3a1d2a;
	border: 1px solid #a33c5a; text-align: center; line-height: 1.4; }
#links { position: absolute; bottom: 1.2rem; display: flex; gap: 1.6rem; font-size: 0.9rem; }
#links a { color: #9fb4ff; text-decoration: none; }
#tools { position: absolute; bottom: 0.6rem; right: 0.6rem; z-index: 1; display: none; gap: 0.5rem; }
#tools button, #tools a { font: inherit; font-size: 0.8rem; padding: 0.4rem 0.8rem; border-radius: 0.4rem; border: 1px solid #3a4078;
	background: rgba(5, 6, 15, 0.6); color: #cfd6ff; cursor: pointer; text-decoration: none; }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Second Credit needs JavaScript to run in the browser.</noscript>
<div id="tools"><button id="fullscreen" title="Fullscreen">Fullscreen</button><a href="../">Back to the site</a></div>
<div id="status">
	<h1>SECOND CREDIT</h1>
	<p id="what">Free remakes of games that deserve another go</p>
	<div id="bar"><div></div></div>
	<p id="progress">Loading...</p>
	<button id="play">CLICK TO PLAY</button>
	<div id="notice"></div>
	<div id="links"><a href="../">The site</a><a href="https://github.com/yoda-jm/project-second-credit/releases/tag/latest">Desktop download (all the games)</a></div>
</div>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
(function () {
	// URL options become user arguments: ?game=tumbletop&demo -> ["--game=tumbletop", "--demo"]
	const params = new URLSearchParams(window.location.search);
	const args = [];
	for (const [k, v] of params) {
		args.push(v === "" ? "--" + k : "--" + k + "=" + v);
	}
	GODOT_CONFIG.args = (GODOT_CONFIG.args || []).concat(args.length ? ["--"].concat(args) : []);  // user arguments follow "--"
	const engine = new Engine(GODOT_CONFIG);
	const status = document.getElementById("status");
	const bar = document.querySelector("#bar > div");
	const progress = document.getElementById("progress");
	const play = document.getElementById("play");
	const notice = document.getElementById("notice");
	const tools = document.getElementById("tools");
	const total = Object.values(GODOT_CONFIG.fileSizes || {}).reduce((a, b) => a + b, 0);
	const mb = (n) => (n / 1048576).toFixed(0) + " MB";

	function fail(err) {
		console.error(err);
		notice.textContent = (err && err.message) ? err.message : String(err);
		notice.style.display = "block";
		play.style.display = "none";
		document.getElementById("bar").style.display = "none";
		progress.style.display = "none";
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail(new Error("This browser cannot run Second Credit (" + missing.join(", ") +
			"). Try a recent Chrome, Firefox or Edge with hardware acceleration on, or the desktop download."));
		return;
	}
	// load everything first; the click starts the engine (the browser lets sound play only after a click)
	let loaded = false;
	engine.startGame({
		onProgress: (current, max) => {
			const t = max > 0 ? max : total;
			if (t > 0) {
				bar.style.width = Math.min(100, (current / t) * 100) + "%";
				progress.textContent = "Loading " + mb(current) + " of " + mb(t);
			}
		},
	}).then(() => {
		loaded = true;
		progress.textContent = "Ready";
		play.style.display = "block";
		play.focus();
	}, fail);
	function start() {
		if (!loaded) return;
		status.remove();
		tools.style.display = "flex";
		document.getElementById("canvas").focus();
	}
	play.addEventListener("click", start);
	document.addEventListener("keydown", (e) => { if (loaded && document.getElementById("status") && e.key === "Enter") start(); });
	document.getElementById("fullscreen").addEventListener("click", () => {
		const c = document.getElementById("canvas");
		(c.requestFullscreen || c.webkitRequestFullscreen).call(c);
		c.focus();
	});
}());
</script>
</body>
</html>
