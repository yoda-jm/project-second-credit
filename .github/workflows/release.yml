name: Release builds

# The launchers (Linux AppImage, Windows zip, macOS zip: the launcher alone) and one pack per game, published as an
# update channel (docs/updater.md), plus the web build for the site:
# - every push to main refreshes the rolling "latest" pre-release (the default channel), then the website
# - tags like m2-bastion or v0.2.0 publish a release of their own (the "stable" channel)
# Nothing is published unless an exported launcher downloads, mounts and runs every game (tools/test-library.sh).
on:
  push:
    branches: [main]
    tags: ["m*", "v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags and history: versions, the core serial, what changed

      - name: Cache portable Godot and export templates
        uses: actions/cache@v6
        with:
          path: .tools
          key: tools-godot-templates-${{ hashFiles('tools/fetch-tools.sh') }}

      - name: Fetch Godot and export templates
        run: tools/fetch-tools.sh godot templates

      - name: Cache Godot's imported assets
        uses: actions/cache@v6
        with:
          path: godot/.godot
          key: godot-import-${{ runner.os }}-${{ hashFiles('godot/project.godot', 'godot/**/*.import', 'godot/**/*.jpg', 'godot/**/*.png', 'godot/**/*.glb', 'godot/**/*.obj', 'godot/**/*.wav', 'godot/**/*.ogg', 'godot/**/*.ttf') }}
          restore-keys: godot-import-${{ runner.os }}-

      - name: The channel's current manifest (for what changed)
        run: |
          mkdir -p build
          if [ "$GITHUB_REF" = refs/heads/main ]; then url=releases/download/latest/manifest.json; else url=releases/latest/download/manifest.json; fi
          curl -fsSL -o build/prev-manifest.json "https://github.com/$GITHUB_REPOSITORY/$url" || rm -f build/prev-manifest.json

      - name: Game packs
        run: tools/export-packs.sh

      - name: Launchers
        run: tools/export.sh

      - name: Web build
        run: |
          SKIP_PACKS=1 SKIP_IMPORT=1 PREV_MANIFEST=build/prev-manifest.json tools/build-web.sh
          (cd build/web && zip -qr ../dist/SecondCredit-web.zip .)

      - name: The launcher downloads, mounts and runs every game
        run: SKIP_PACKS=1 tools/test-library.sh

      - name: Update channel
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then  # the rolling release keeps the packs it already has
            python3 tools/make_manifest.py --channel latest --prev build/prev-manifest.json --keep-published --out build/channel
          else
            python3 tools/make_manifest.py --channel stable --prev build/prev-manifest.json --out build/channel
          fi

      - name: Upload the launchers
        uses: actions/upload-artifact@v7
        with:
          name: second-credit-launchers
          path: build/dist/*
          retention-days: 7

      - name: Publish the rolling "latest" channel
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/publish-channel.sh latest build/prev-manifest.json

      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/publish-channel.sh "$GITHUB_REF_NAME" build/prev-manifest.json

  site:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
