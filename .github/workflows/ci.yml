name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Scripts and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: System packages (virtual display, software OpenGL), cached
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: xvfb libgl1-mesa-dri libglx-mesa0 libvulkan1
          version: 1.0

      - name: Cache portable Godot
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-godot-${{ hashFiles('tools/fetch-tools.sh') }}

      - name: Fetch Godot
        run: tools/fetch-tools.sh godot

      - name: Cache Godot's imported assets
        uses: actions/cache@v4
        with:
          path: godot/.godot
          key: godot-import-${{ runner.os }}-${{ hashFiles('godot/project.godot', 'godot/**/*.import', 'godot/**/*.jpg', 'godot/**/*.png', 'godot/**/*.glb', 'godot/**/*.obj', 'godot/**/*.wav', 'godot/**/*.ogg', 'godot/**/*.ttf') }}
          restore-keys: godot-import-${{ runner.os }}-

      - name: Parse every script
        run: tools/check.sh

      - name: GdUnit4 tests
        run: tools/test.sh

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: godot/reports/
          if-no-files-found: ignore
